name: TraceCompass APP Release

on:
  push:
    branches:
      - rocpd_support

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Maven
      uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f
      with:
        maven-version: 3.9.5

    - name: Build TraceCompass APP for all platforms
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3
      with:
        run: >-
          mvn -B clean install
          -pl rcp/org.eclipse.tracecompass.incubator.rcp.product
          -am

    - name: Create timestamp for release
      id: timestamp
      run: echo "timestamp=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Find built artifacts
      id: artifacts
      run: |
        # Find the built product archives
        PRODUCT_DIR="rcp/org.eclipse.tracecompass.incubator.rcp.product/target/products"
        if [ -d "$PRODUCT_DIR" ]; then
          echo "linux_artifact=$(find $PRODUCT_DIR -name '*linux*.tar.gz' | head -1)" >> $GITHUB_OUTPUT
          echo "macos_artifact=$(find $PRODUCT_DIR -name '*macosx*.tar.gz' | head -1)" >> $GITHUB_OUTPUT
          echo "windows_artifact=$(find $PRODUCT_DIR -name '*win32*.zip' | head -1)" >> $GITHUB_OUTPUT
        else
          echo "Product directory not found: $PRODUCT_DIR"
          exit 1
        fi

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: tracecompass-app-${{ steps.timestamp.outputs.timestamp }}
        release_name: TraceCompass APP Release ${{ steps.timestamp.outputs.timestamp }}
        body: |
          TraceCompass APP packages for Windows, macOS, and Linux
          
          Built from commit: ${{ github.sha }}
          
          ## Downloads
          - **Linux**: trace-compass-*-linux.gtk.x86_64.tar.gz
          - **macOS**: trace-compass-*-macosx.cocoa.x86_64.tar.gz  
          - **Windows**: trace-compass-*-win32.win32.x86_64.zip
        draft: false
        prerelease: false

    - name: Upload Linux Release Asset
      if: steps.artifacts.outputs.linux_artifact != ''
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.artifacts.outputs.linux_artifact }}
        asset_name: trace-compass-${{ steps.timestamp.outputs.timestamp }}-linux.gtk.x86_64.tar.gz
        asset_content_type: application/gzip

    - name: Upload macOS Release Asset
      if: steps.artifacts.outputs.macos_artifact != ''
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.artifacts.outputs.macos_artifact }}
        asset_name: trace-compass-${{ steps.timestamp.outputs.timestamp }}-macosx.cocoa.x86_64.tar.gz
        asset_content_type: application/gzip

    - name: Upload Windows Release Asset
      if: steps.artifacts.outputs.windows_artifact != ''
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.artifacts.outputs.windows_artifact }}
        asset_name: trace-compass-${{ steps.timestamp.outputs.timestamp }}-win32.win32.x86_64.zip
        asset_content_type: application/zip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tracecompass-app-packages-${{ steps.timestamp.outputs.timestamp }}
        path: |
          rcp/org.eclipse.tracecompass.incubator.rcp.product/target/products/*.tar.gz
          rcp/org.eclipse.tracecompass.incubator.rcp.product/target/products/*.zip
        retention-days: 30