name: TraceCompass APP Release

on:
  push:
    branches:
      - rocpd_support
  pull_request:
    branches:
      - rocpd_support

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Maven
      uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f # v4.5
      with:
        maven-version: 3.9.5

    - name: Build TraceCompass APP for all platforms
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3
      with:
        run: >-
          mvn -B clean install -Dmaven.test.skip=true

    - name: Create timestamp for release
      id: timestamp
      run: echo "timestamp=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Find built artifacts
      id: artifacts
      run: |
        # Find the built product archives
        PRODUCT_DIR="rcp/org.eclipse.tracecompass.incubator.rcp.product/target/products"
        if [ -d "$PRODUCT_DIR" ]; then
          echo "linux_artifact=$(find $PRODUCT_DIR -name '*linux*.tar.gz' | head -1)" >> $GITHUB_OUTPUT
          echo "macos_x86_64_artifact=$(find $PRODUCT_DIR -name '*macosx*x86_64*.tar.gz' | head -1)" >> $GITHUB_OUTPUT
          echo "macos_aarch64_artifact=$(find $PRODUCT_DIR -name '*macosx*aarch64*.tar.gz' | head -1)" >> $GITHUB_OUTPUT
          echo "windows_artifact=$(find $PRODUCT_DIR -name '*win32*.zip' | head -1)" >> $GITHUB_OUTPUT
        else
          echo "Product directory not found: $PRODUCT_DIR"
          exit 1
        fi

    - name: Create Release
      if: github.event_name == 'push'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: tracecompass-app-${{ steps.timestamp.outputs.timestamp }}
        release_name: TraceCompass APP Release ${{ steps.timestamp.outputs.timestamp }}
        body: |
          TraceCompass APP packages for Windows, macOS, and Linux
          
          Built from commit: ${{ github.sha }}
          
          ## Downloads
          - **Linux**: trace-compass-*-linux.gtk.x86_64.tar.gz
          - **macOS (Intel)**: trace-compass-*-macosx.cocoa.x86_64.tar.gz  
          - **macOS (Apple Silicon)**: trace-compass-*-macosx.cocoa.aarch64.tar.gz  
          - **Windows**: trace-compass-*-win32.win32.x86_64.zip
          
          ## macOS Users - Important Notice
          
          ⚠️ **These development builds are unsigned** and will trigger macOS Gatekeeper security warnings.
          
          If you see "trace-compass is damaged and can't be opened", use one of these methods:
          
          **Method 1 - Right-click to open:**
          1. Extract the downloaded .tar.gz file
          2. Right-click on `trace-compass.app` and select "Open"
          3. When the warning appears, click "Open" to bypass Gatekeeper
          
          **Method 2 - Remove quarantine:**
          ```bash
          xattr -d com.apple.quarantine /path/to/trace-compass.app
          ```
          
          Official Eclipse releases will be properly code-signed and won't require these steps.
        draft: false
        prerelease: false

    - name: Upload Linux Release Asset
      if: github.event_name == 'push' && steps.artifacts.outputs.linux_artifact != ''
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.artifacts.outputs.linux_artifact }}
        asset_name: trace-compass-${{ steps.timestamp.outputs.timestamp }}-linux.gtk.x86_64.tar.gz
        asset_content_type: application/gzip

    - name: Upload macOS (Intel) Release Asset
      if: github.event_name == 'push' && steps.artifacts.outputs.macos_x86_64_artifact != ''
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.artifacts.outputs.macos_x86_64_artifact }}
        asset_name: trace-compass-${{ steps.timestamp.outputs.timestamp }}-macosx.cocoa.x86_64.tar.gz
        asset_content_type: application/gzip

    - name: Upload macOS (Apple Silicon) Release Asset
      if: github.event_name == 'push' && steps.artifacts.outputs.macos_aarch64_artifact != ''
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.artifacts.outputs.macos_aarch64_artifact }}
        asset_name: trace-compass-${{ steps.timestamp.outputs.timestamp }}-macosx.cocoa.aarch64.tar.gz
        asset_content_type: application/gzip

    - name: Upload Windows Release Asset
      if: github.event_name == 'push' && steps.artifacts.outputs.windows_artifact != ''
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.artifacts.outputs.windows_artifact }}
        asset_name: trace-compass-${{ steps.timestamp.outputs.timestamp }}-win32.win32.x86_64.zip
        asset_content_type: application/zip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tracecompass-app-packages-${{ steps.timestamp.outputs.timestamp }}
        path: |
          rcp/org.eclipse.tracecompass.incubator.rcp.product/target/products/*.tar.gz
          rcp/org.eclipse.tracecompass.incubator.rcp.product/target/products/*.zip
        retention-days: 30
